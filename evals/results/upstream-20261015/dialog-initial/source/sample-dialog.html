<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reference component prototype</title><link rel="stylesheet" href="styles.css"></head><body><div class="dialog-sample"><div data-ui-unit="dialog" class="dialog-content"><div class="dialog-heading"><h2 id="booking-title">수업 예약</h2><button id="close-booking" type="button" aria-label="예약 창 닫기">닫기</button></div><div id="booking-product" class="booking-summary"><p class="section-label">선택한 수업</p><p class="booking-class">내 손으로 빚는 첫 번째 도자기 잔</p><p class="booking-price">55,000원 · 90분 · 1명</p></div><form id="booking-form"><div class="booking-field"><label for="guest">예약자 이름</label><div class="field-control"><input id="guest" name="guest" autocomplete="name" required maxlength="40"></div></div><div class="booking-field"><label for="date">방문일</label><div class="field-control"><input id="date" name="date" type="date" required></div></div><div class="booking-field"><label for="slot">예약 시간</label><div class="field-control"><select id="slot" name="slot" required><option value="">시간을 선택하세요</option><option value="10:00">오전 10:00</option><option value="14:00">오후 2:00</option><option value="18:00">오후 6:00</option></select></div></div><p id="storage-error" role="alert"></p><button class="confirm-booking" type="submit">예약 확정</button></form><section id="confirmation" hidden><p class="confirmation-intro">선택한 일정으로 예약을 저장했어요.</p><div class="booking-summary"><p class="section-label">예약 내역</p><p id="confirmation-details"></p></div><p id="cancel-error" role="alert"></p><button id="cancel-booking" type="button">예약 취소</button></section></div></div></body></html>
