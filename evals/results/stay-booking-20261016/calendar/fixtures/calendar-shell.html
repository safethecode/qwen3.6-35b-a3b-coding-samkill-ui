<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>날짜 선택</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="calendar.css"><body><main><label for="sample-start">체크인</label><input id="sample-start" type="date" value="2026-11-06"><label for="sample-end">체크아웃</label><input id="sample-end" type="date" value="2026-11-08"><button id="open-calendar" type="button">날짜 선택</button></main><dialog id="date-calendar" aria-labelledby="date-calendar-title"><div class="calendar-shell"><header class="calendar-header"><h2 id="date-calendar-title">날짜 선택</h2><button id="calendar-cancel" type="button">취소</button></header><div class="calendar-controls"><button id="calendar-previous" type="button" aria-label="이전 달"><img src="assets/icons/ChevronLeft.svg" width="20" height="20" alt=""></button><button id="calendar-next" type="button" aria-label="다음 달"><img src="assets/icons/ChevronRight.svg" width="20" height="20" alt=""></button></div><div class="calendar-weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar-months"></div><footer class="calendar-footer"><p id="calendar-selection" aria-live="polite"></p><p id="calendar-error" role="alert"></p><button id="calendar-apply" type="button">적용하기</button></footer></div></dialog><script type="module">import{installDateCalendar}from'./calendar-controller.js';const id=value=>document.getElementById(value);window.sampleApplies=[];window.calendar=installDateCalendar({dialog:id('date-calendar'),today:'2026-10-16'});id('open-calendar').addEventListener('click',()=>window.calendar.open({start:id('sample-start').value,end:id('sample-end').value},value=>{window.sampleApplies.push(value);id('sample-start').value=value.start;id('sample-end').value=value.end;},id('open-calendar')));</script></body></html>
