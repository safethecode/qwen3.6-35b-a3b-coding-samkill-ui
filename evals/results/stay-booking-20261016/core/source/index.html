<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>숙소 찾기</title><link rel="stylesheet" href="styles.css"></head><body><header data-ui-unit="search" class="search-header"><div class="search-entry"><button id="open-search" type="button"><img class="" src="assets/icons/Search.svg" width="20" height="20" alt=""><span class="search-summary"><strong id="destination-summary">강릉</strong><span id="trip-summary">11월 6일–8일 · 게스트 2명</span></span></button><button id="open-filters" type="button"><img class="" src="assets/icons/SlidersHorizontal.svg" width="20" height="20" alt=""><span>필터</span></button></div><div class="result-tools"><p id="result-count" role="status"></p><div class="sort-control"><label for="sort">정렬</label><div class="field-control"><select id="sort"><option value="recommended">추천순</option><option value="price-asc">낮은 가격순</option><option value="price-desc">높은 가격순</option></select><img class="select-chevron" src="assets/icons/ChevronDown.svg" width="20" height="20" alt="" aria-hidden="true"></div></div></div></header><main id="main-content"><div id="storage-error-region" hidden><p id="storage-error" role="alert"></p><button id="reload-favorites" type="button">다시 불러오기</button></div><section data-ui-unit="stays" id="stays-view"><h1 class="visually-hidden">숙소 검색 결과</h1><div id="results-list"><article class="stay-card" id="card-afternoon" data-stay-id="afternoon"><div class="stay-media"><a class="stay-photo-link" href="#stay/afternoon" aria-label="오후의 방 상세 보기"><img class="stay-photo" src="assets/photos/room-neutral.jpg" alt="파란 의자와 무늬 있는 침구가 놓인 객실" width="1125" height="750"></a><button class="favorite" data-favorite="afternoon" type="button" disabled aria-label="오후의 방 찜 상태 미확인"><img class="" src="assets/icons/Heart.svg" width="20" height="20" alt=""><span>찜</span></button></div><div class="stay-facts"><h2><a href="#stay/afternoon">오후의 방</a></h2><p class="stay-location">강릉 경포 · 호텔</p><p field="nightly"></strong><span> /박</span></p><p class="stay-total" data-field="total"></p><p class="stay-unavailable" data-field="unavailable" hidden>선택한 조건에 맞는 객실이 없어요.</p></div></article></div><div id="empty-results" hidden><h2 id="empty-title">조건에 맞는 숙소가 없어요.</h2><button id="adjust-search" type="button">여행 정보 바꾸기</button><button id="clear-filters" type="button">필터 지우기</button></div></section><section id="detail-view" hidden><button id="return-results" type="button"><img class="" src="assets/icons/ChevronLeft.svg" width="20" height="20" alt=""><span>검색 결과로</span></button><img id="detail-photo" alt="" width="1125" height="750"><h1 id="detail-title"></h1><p id="detail-location"></p><section><h2>객실과 요금</h2><div id="detail-rooms"></div></section></section><section id="requests-view" hidden><h1>예약 요청</h1><p id="requests-empty">저장한 예약 요청이 없어요.</p><p id="requests-error" role="alert"></p><button id="requests-reload" type="button" hidden>다시 불러오기</button></section></main><nav data-ui-unit="navigation" class="bottom-navigation" aria-label="주요 메뉴"><a href="#browse" data-destination="browse"><img class="" src="assets/icons/Search.svg" width="20" height="20" alt=""><span>숙소 찾기</span></a><a href="#saved" data-destination="saved"><img class="" src="assets/icons/Heart.svg" width="20" height="20" alt=""><span>찜한 숙소</span></a><a href="#requests" data-destination="requests"><img class="" src="assets/icons/ClipboardList.svg" width="20" height="20" alt=""><span>예약 요청</span></a></nav><dialog id="search-dialog" aria-labelledby="search-title"><form id="search-form" novalidate><div class="sheet-heading"><h2 id="search-title">여행 정보</h2><button type="button" data-close="search-dialog">취소</button></div><label for="city">여행지</label><div class="field-control"><select id="city"><option value="강릉">강릉</option><option value="서울">서울</option><option value="제주">제주</option><option value="">전체</option></select><img class="select-chevron" src="assets/icons/ChevronDown.svg" width="20" height="20" alt="" a
