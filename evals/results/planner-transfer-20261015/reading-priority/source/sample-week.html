<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reference component prototype</title><link rel="stylesheet" href="styles.css"></head><body><header data-ui-unit="week" class="planner-header" aria-label="할 일 날짜"><div class="planner-heading"><h1 id="selected-date">10월 15일 목요일</h1></div><div id="week-days" class="week-strip" aria-label="날짜 선택"><button class="day-button" type="button" data-date="2026-10-12" aria-label="10월 12일 월요일" aria-pressed="false"><span class="weekday">월</span><span class="day-number">12</span></button><button class="day-button" type="button" data-date="2026-10-13" aria-label="10월 13일 화요일" aria-pressed="false"><span class="weekday">화</span><span class="day-number">13</span></button><button class="day-button" type="button" data-date="2026-10-14" aria-label="10월 14일 수요일" aria-pressed="false"><span class="weekday">수</span><span class="day-number">14</span></button><button class="day-button" type="button" data-date="2026-10-15" aria-label="10월 15일 목요일" aria-pressed="true"><span class="weekday">목</span><span class="day-number">15</span></button><button class="day-button" type="button" data-date="2026-10-16" aria-label="10월 16일 금요일" aria-pressed="false"><span class="weekday">금</span><span class="day-number">16</span></button><button class="day-button" type="button" data-date="2026-10-17" aria-label="10월 17일 토요일" aria-pressed="false"><span class="weekday">토</span><span class="day-number">17</span></button><button class="day-button" type="button" data-date="2026-10-18" aria-label="10월 18일 일요일" aria-pressed="false"><span class="weekday">일</span><span class="day-number">18</span></button></div></header></body></html>
