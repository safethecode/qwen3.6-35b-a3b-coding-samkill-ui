<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reference component prototype</title><link rel="stylesheet" href="styles.css"></head><body><div class="editor-sample"><div data-ui-unit="editor" class="task-form-panel"><div class="editor-heading"><h2 id="task-title">할 일 추가</h2><button id="close-task" type="button">닫기</button></div><form id="task-form"><div class="form-field"><label for="task-name">할 일</label><div class="field-control"><input id="task-name" name="title" required maxlength="120" autocomplete="off"></div></div><div class="form-field"><label for="task-category">분류</label><div class="field-control"><select id="task-category" name="category"><option value="study">공부</option><option value="life">생활</option></select></div></div><p id="task-error" role="alert"></p><button id="save-task" type="submit">추가하기</button></form></div></div></body></html>
