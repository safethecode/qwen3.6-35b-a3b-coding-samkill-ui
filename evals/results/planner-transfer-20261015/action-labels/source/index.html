<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reference component prototype</title><link rel="stylesheet" href="styles.css"></head><body><header data-ui-unit="week" class="planner-header" aria-label="할 일 날짜"><h1 id="selected-date">10월 15일 목요일</h1><div id="week-days" class="week-strip" aria-label="날짜 선택"><button class="day-button" type="button" data-date="2026-10-12" aria-label="10월 12일 월요일" aria-pressed="false"><span class="weekday">월</span><span class="day-number">12</span></button><button class="day-button" type="button" data-date="2026-10-13" aria-label="10월 13일 화요일" aria-pressed="false"><span class="weekday">화</span><span class="day-number">13</span></button><button class="day-button" type="button" data-date="2026-10-14" aria-label="10월 14일 수요일" aria-pressed="false"><span class="weekday">수</span><span class="day-number">14</span></button><button class="day-button" type="button" data-date="2026-10-15" aria-label="10월 15일 목요일" aria-pressed="true"><span class="weekday">목</span><span class="day-number">15</span></button><button class="day-button" type="button" data-date="2026-10-16" aria-label="10월 16일 금요일" aria-pressed="false"><span class="weekday">금</span><span class="day-number">16</span></button><button class="day-button" type="button" data-date="2026-10-17" aria-label="10월 17일 토요일" aria-pressed="false"><span class="weekday">토</span><span class="day-number">17</span></button><button class="day-button" type="button" data-date="2026-10-18" aria-label="10월 18일 일요일" aria-pressed="false"><span class="weekday">일</span><span class="day-number">18</span></button></div></header><main data-ui-unit="tasks" class="task-groups"><p id="empty-state">등록한 할 일이 없어요</p><section class="task-category" aria-labelledby="study-title"><div class="category-heading"><h2 id="study-title">공부</h2><button class="add-task" type="button" data-add-category="study" aria-label="공부 할 일 추가"><img src="assets/icons/Plus.svg" width="20" height="20" alt=""><span>추가</span></button></div><ul id="study-items" class="task-list"></ul></section><section class="task-category" aria-labelledby="life-title"><div class="category-heading"><h2 id="life-title">생활</h2><button class="add-task" type="button" data-add-category="life" aria-label="생활 할 일 추가"><img src="assets/icons/Plus.svg" width="20" height="20" alt=""><span>추가</span></button></div><ul id="life-items" class="task-list"></ul></section><template id="task-template"><li class="task-row"><label class="task-toggle"><input class="task-check" type="checkbox"><span class="task-name"></span></label><button class="delete-task" type="button" aria-label="할 일 삭제"><img src="assets/icons/Trash2-neutral.svg" width="20" height="20" alt=""><span>삭제</span></button></li></template><p id="page-error" role="alert"></p></main><dialog id="task-dialog" aria-labelledby="task-title"><div data-ui-unit="editor" class="task-form-panel"><div class="editor-heading"><h2 id="task-title">할 일 추가</h2><button id="close-task" type="button">닫기</button></div><form id="task-form"><div class="form-field"><label for="task-name">할 일</label><div class="field-control"><input id="task-name" name="title" required maxlength="120" autocomplete="off"></div></div><div class="form-field"><label for="task-category">분류</label><div class="field-control"><select id="task-category" name="category"><option value="study">공부</option><option value="life">생활</option></select></div></div><p id="task-error" role="alert"></p><button id="save-task" type="submit">추가하기</button></form></div></dialog><script type="module" src="app.js"></script></body></html>
