<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reference component prototype</title><link rel="stylesheet" href="styles.css"></head><body><main data-ui-unit="tasks" class="task-groups"><p id="empty-state">등록한 할 일이 없어요</p><section class="task-category" aria-labelledby="study-title"><div class="category-heading"><h2 id="study-title">공부</h2><button class="add-task" type="button" data-add-category="study" aria-label="공부 할 일 추가"><img src="assets/icons/Plus.svg" width="20" height="20" alt=""><span>추가</span></button></div><ul id="study-items" class="task-list"></ul></section><section class="task-category" aria-labelledby="life-title"><div class="category-heading"><h2 id="life-title">생활</h2><button class="add-task" type="button" data-add-category="life" aria-label="생활 할 일 추가"><img src="assets/icons/Plus.svg" width="20" height="20" alt=""><span>추가</span></button></div><ul id="life-items" class="task-list"></ul></section><template id="task-template"><li class="task-row"><label class="task-toggle"><input class="task-check" type="checkbox"><span class="task-name"></span></label><button class="delete-task" type="button" aria-label="할 일 삭제"><img src="assets/icons/Trash2-neutral.svg" width="20" height="20" alt=""><span>삭제</span></button></li></template><p id="page-error" role="alert"></p></main></body></html>
