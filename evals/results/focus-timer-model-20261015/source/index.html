<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>집중 타이머</title><link rel="stylesheet" href="styles.css"></head><body><main class="focus-screen"><h1 id="screen-title">집중 타이머</h1><div class="focus-session"><section data-ui-unit="timer" class="timer-stage" aria-label="집중 시간"><div class="stage-content"><div id="time-readout" class="time-readout" role="timer" aria-live="off" aria-label="남은 시간" hidden><span class="time-pair"><span id="minutes" class="time-number">--</span><span class="time-unit">분</span></span><span class="time-pair"><span id="seconds" class="time-number">--</span><span class="time-unit">초</span></span></div><section id="completed" aria-labelledby="completed-title" hidden><h2 id="completed-title">집중 완료</h2><p id="completed-duration"></p></section><p id="unknown-time" aria-label="남은 시간 미확인">—</p><p id="paused-status" hidden>일시 정지</p><button id="configure-duration" class="text-action" type="button" disabled>시간 설정</button></div><div id="main-error-region" class="error-region" hidden><p id="main-error" role="alert"></p><button id="reload-session" class="text-action" type="button">다시 불러오기</button></div></section><div data-ui-unit="actions" class="session-actions"><button id="primary-action" type="button" disabled><img id="primary-icon" src="assets/icons/Play-light.svg" width="20" height="20" alt=""><span id="primary-label">시작하기</span></button><button id="reset-session" class="text-action" type="button" hidden>타이머 초기화</button></div></div></main><dialog id="duration-dialog" aria-labelledby="duration-title"><section data-ui-unit="config" class="duration-panel"><div class="config-heading"><h2 id="duration-title">집중 시간</h2><button id="cancel-duration" class="text-action" type="button">취소</button></div><form id="duration-form" novalidate><div class="duration-field"><label for="duration-input">시간(분)</label><div class="field-control"><input id="duration-input" name="minutes" type="number" min="1" max="180" step="1" required inputmode="numeric" aria-describedby="duration-error"></div><p id="duration-error" role="alert"></p></div><div id="config-error-region" class="error-region" hidden><p id="config-error" role="alert"></p><button id="reload-config-session" class="text-action" type="button">다시 불러오기</button></div><button id="apply-duration" type="submit">적용하기</button></form></section></dialog><script type="module" src="app.js"></script></body></html>
