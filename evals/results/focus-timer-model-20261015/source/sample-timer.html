<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>집중 타이머</title><link rel="stylesheet" href="styles.css"></head><body><main class="focus-screen"><section data-ui-unit="timer" class="timer-stage" aria-label="집중 시간"><div class="stage-content"><div id="time-readout" class="time-readout" role="timer" aria-live="off" aria-label="남은 시간" hidden><span class="time-pair"><span id="minutes" class="time-number">--</span><span class="time-unit">분</span></span><span class="time-pair"><span id="seconds" class="time-number">--</span><span class="time-unit">초</span></span></div><section id="completed" aria-labelledby="completed-title" hidden><h2 id="completed-title">집중 완료</h2><p id="completed-duration"></p></section><p id="unknown-time" aria-label="남은 시간 미확인">—</p><p id="paused-status" hidden>일시 정지</p><button id="configure-duration" class="text-action" type="button" disabled>시간 설정</button></div><div id="main-error-region" class="error-region" hidden><p id="main-error" role="alert"></p><button id="reload-session" class="text-action" type="button">다시 불러오기</button></div></section></main></body></html>
