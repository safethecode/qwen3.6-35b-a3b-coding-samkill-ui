<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>집중 타이머</title><link rel="stylesheet" href="styles.css"></head><body><div class="config-sample"><section data-ui-unit="config" class="duration-panel"><div class="config-heading"><h2 id="duration-title">집중 시간</h2><button id="cancel-duration" class="text-action" type="button">취소</button></div><form id="duration-form" novalidate><div class="duration-field"><label for="duration-input">시간(분)</label><div class="field-control"><input id="duration-input" name="minutes" type="number" min="1" max="180" step="1" required inputmode="numeric" aria-describedby="duration-error"></div><p id="duration-error" role="alert"></p></div><div id="config-error-region" class="error-region" hidden><p id="config-error" role="alert"></p><button id="reload-config-session" class="text-action" type="button">다시 불러오기</button></div><button id="apply-duration" type="submit">적용하기</button></form></section></div></body></html>
